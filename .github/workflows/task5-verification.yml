name: Task5 verification

on:
  pull_request:
  push:
    branches: [main, feature/task5-evidence-explorer]

jobs:
  task5:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trackai
          POSTGRES_PASSWORD: trackai_test_only
          POSTGRES_DB: trackai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackai -d trackai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://trackai:trackai_test_only@localhost:5432/trackai
      MASTER_ENCRYPTION_KEY_ACTIVE_VERSION: ci-v1
      MASTER_ENCRYPTION_KEYS_JSON: '{"ci-v1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --workspace=apps/api
      - run: npm run db:migrate --workspace=apps/api
      - run: npm run verify:task5-schema --workspace=apps/api
      - run: npm run verify:task5-corpus-live --workspace=apps/api
      - run: npm run verify:task5-opencode-live --workspace=apps/api
        env:
          TASK5_EPHEMERAL_DATABASE: '1'
      - run: npm run verify:task5-graph-live --workspace=apps/api
        env:
          TASK5_EPHEMERAL_DATABASE: '1'
      - run: npm run verify:task5-retention-live --workspace=apps/api
        env:
          TASK5_EPHEMERAL_DATABASE: '1'
      - run: npm run verify:task5-analytics-live --workspace=apps/api
        env:
          TASK5_EPHEMERAL_DATABASE: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/scripts/requirements-semantic.txt
      - run: pip install --requirement apps/api/scripts/requirements-semantic.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trackai/bge-small-en-v1.5-5c38ec7
          key: task5-bge-small-en-v1.5-5c38ec7-v1
      - run: >-
          python apps/api/scripts/prepare-task5-bge.py
          --output "$HOME/.cache/trackai/bge-small-en-v1.5-5c38ec7"
      - run: npm run verify:task5-semantic-live --workspace=apps/api
        env:
          TASK5_EPHEMERAL_DATABASE: '1'
          TRACKAI_BGE_EXECUTABLE: ${{ github.workspace }}/apps/api/scripts/trackai-bge-embed.py
          TRACKAI_BGE_MODEL_PATH: /home/runner/.cache/trackai/bge-small-en-v1.5-5c38ec7
          TRACKAI_BGE_REVISION: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
          TRACKAI_BGE_CHECKSUM: 3c9f31665447c8911517620762200d2245a2518d6e7208acc78cd9db317e21ad
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npx tsc --noEmit -p apps/web/tsconfig.json
      - run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: task5-ci-public-placeholder
